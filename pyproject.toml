[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-router"
version = "0.1.0"
description = "A local baseline for classifying support tickets and suggesting destination teams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.5,<2.0", "joblib>=1.4,<2.0"]

[project.scripts]
support-ticket-router = "support_ticket_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
